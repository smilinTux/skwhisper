# SKWhisper Configuration
#
# Agent-specific paths are resolved at runtime from SKAGENT (or SKCAPSTONE_AGENT).
# You do NOT need to edit this file per-agent — just set SKAGENT before starting
# the daemon (e.g. SKAGENT=jarvis skwhisper). Per-agent overrides may live at
#   ~/.skcapstone/agents/<agent>/config/skwhisper.toml
#
# Sovereign defaults (v0.4.0+):
#   sessions_dir = ~/.skcapstone/agents/{agent}/sessions   (symlink your tool here)
#   memory_dir   = ~/.skcapstone/agents/{agent}/memory
#   state_dir    = ~/.skcapstone/agents/{agent}/skwhisper

[paths]
# Uncomment to override the agent-specific runtime defaults:
# sessions_dir = "~/.skcapstone/agents/lumina/sessions"
# memory_dir   = "~/.skcapstone/agents/lumina/memory"
# state_dir    = "~/.skcapstone/agents/lumina/skwhisper"

[agent]
# Labels used when formatting conversation transcripts for the summarizer.
user_label = "Casey"
agent_label = "Lumina"   # e.g. Jarvis, Aster, Lumina

[ollama]
# Each digest makes TWO model calls that target DIFFERENT endpoints:
#
#   1. EMBED     -> Ollama mxbai-embed-large (1024-dim vector) on :11434
#   2. SUMMARIZE -> the already-resident qwen3.6-27B (OpenAI server) on :8082
#
# --- EMBED (vector) -------------------------------------------------------
ollama_url = "http://192.168.0.100:11434"   # Ollama on the GPU host (/api/embed)
embed_model = "mxbai-embed-large"            # 1024-dim; query MUST use the SAME model
#
# --- SUMMARIZE (LLM generation) -------------------------------------------
# Reuse the qwen3.6-27B already loaded on the 5060 Ti (16GB CUDA). It is the
# ONLY model that should run on that GPU: CUDA is full, the Intel Arc iGPU
# CORRUPTS generated output via Vulkan (confirmed), and a separate small model
# spills to CPU and saturates the host. Reusing qwen3.6 costs zero extra VRAM,
# produces correct output, and a short digest call runs in ~1.5s.
# (Prior summarize_model values — llama3.2:3b then qwen3.5:4b — were both wrong:
#  one was removed from the host → 404 flood; the other spilled to CPU.)
summarize_url = "http://192.168.0.100:8082"  # the qwen3.6 OpenAI-compatible server
summarize_api = "openai"                      # "openai" (default) | "ollama" (legacy /api/generate)
summarize_model = "qwen3.6"

# Vector/graph store = local Postgres + pgvector (see clients/pgmem.py).
# The douno cluster (qdrant/skvector + FalkorDB/skgraph) is RETIRED — these blocks
# are dormant fallbacks only; endpoints come from env (SKVECTOR_URL/SKVECTOR_API_KEY)
# if ever revived.
[qdrant]
url = ""
api_key = ""
# collection is auto-derived as "{agent}-memory" — override here if needed.

[falkordb]
host = ""
port = 16379
# graph is auto-derived as "{agent}_knowledge"; superseded by Apache AGE in the
# local Postgres (graph: {agent}_knowledge).

[watcher]
poll_interval = 60
idle_threshold = 300
min_messages = 5

[curator]
curate_interval = 1800
top_k = 10
max_whisper_tokens = 2000

[patterns]
top_n_topics = 20
decay_days = 30
