name: Tests

# skwhisper had no test CI (only publish.yml), so nothing ran on a PR. The sensitivity
# parity test pins skwhisper/sensitivity.py to skmemory/hooks/sensitivity.py, so skmemory
# is installed from git main and the parity test is REQUIRED (it fails, never skips).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install skmemory from git main, then skwhisper
        run: |
          python -m pip install --upgrade pip
          pip install "skmemory @ git+https://github.com/smilinTux/skmemory@main"
          pip install -e ".[dev]"
      - name: Run tests
        env:
          SKWHISPER_REQUIRE_PARITY: "1"
        run: python -m pytest tests -q
